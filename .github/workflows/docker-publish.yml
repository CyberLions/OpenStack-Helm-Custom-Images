name: Docker Build and Publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #schedule:
  #  - cron: '0 8 * * MON'
  push:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>


jobs:
  build_matrix_rack:
    strategy:
      matrix:
        container: ["keystone-oidc", "horizon-heat", "nova_novncproxy", "nova_spiceproxy"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Convert registry owner to lowercase
        id: repository_owner
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./${{ matrix.container }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ steps.repository_owner.outputs.lowercase }}/${{ matrix.container }}:2024.2-ubuntu_jammy-${{ steps.date.outputs.date }},${{ env.REGISTRY }}/${{ steps.repository_owner.outputs.lowercase }}/${{ matrix.container }}:2024.2-ubuntu_jammy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_matrix_rack_epoxy:
    strategy:
      matrix:
        include:
          - container: "nova_novncproxy"
            base_image: "quay.io/airshipit/nova:2025.1-ubuntu_noble"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    # NOTE: upstream openstackhelm/horizon and openstackhelm/keystone 2025.1 Noble base images are
    # not currently published on Docker Hub, so these builds cannot run successfully yet.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Convert registry owner to lowercase
        id: repository_owner
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./${{ matrix.container }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.REGISTRY }}/${{ steps.repository_owner.outputs.lowercase }}/${{ matrix.container }}:2025.1-ubuntu_noble-${{ steps.date.outputs.date }},${{ env.REGISTRY }}/${{ steps.repository_owner.outputs.lowercase }}/${{ matrix.container }}:2025.1-ubuntu_noble
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_matrix-cloud:
    strategy:
      matrix:
        container: ["pritunl-nginx-proxy", "general-nginx-proxy"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to CCSO Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.psuccso.org
          username: robot$gh-misc
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./${{ matrix.container }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.psuccso.org/${{ matrix.container }}/${{ matrix.container }}:latest
            registry.psuccso.org/${{ matrix.container }}/${{ matrix.container }}:${{ steps.date.outputs.date }}
          cache-from: type=registry,ref=registry.psuccso.org/${{ matrix.container }}/${{ matrix.container }}:latest
          cache-to: type=inline