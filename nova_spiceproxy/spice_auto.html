        <script>
            /* Patch mouse position to use getBoundingClientRect() so coordinates are correct
               when the canvas is centered or has layout offset (offsetLeft/offsetTop are wrong). */
            (function() {
                var canvasCoords = function(sc, e) {
                    var canvas = sc.display && sc.display.surfaces && sc.display.primary_surface !== undefined
                        ? sc.display.surfaces[sc.display.primary_surface].canvas
                        : null;
                    if (!canvas) return { x: 0, y: 0 };
                    var r = canvas.getBoundingClientRect();
                    return {
                        x: Math.round(e.clientX - r.left),
                        y: Math.round(e.clientY - r.top)
                    };
                };
                var origMousePosition = window.SpiceMsgcMousePosition;
                var origMouseMotion = window.SpiceMsgcMouseMotion;
                if (origMousePosition) {
                    window.SpiceMsgcMousePosition = function(sc, e) {
                        this.display_id = 0;
                        this.buttons_state = sc.buttons_state;
                        if (e) {
                            var c = canvasCoords(sc, e);
                            this.x = c.x;
                            this.y = c.y;
                            sc.mousex = c.x;
                            sc.mousey = c.y;
                        } else {
                            this.x = this.y = this.buttons_state = 0;
                        }
                    };
                    window.SpiceMsgcMousePosition.prototype = origMousePosition.prototype;
                }
                if (origMouseMotion) {
                    window.SpiceMsgcMouseMotion = function(sc, e) {
                        this.display_id = 0;
                        this.buttons_state = sc.buttons_state;
                        if (e) {
                            var c = canvasCoords(sc, e);
                            this.x = c.x - (sc.mousex !== undefined ? sc.mousex : 0);
                            this.y = c.y - (sc.mousey !== undefined ? sc.mousey : 0);
                            sc.mousex = c.x;
                            sc.mousey = c.y;
                        } else {
                            this.x = this.y = this.buttons_state = 0;
                        }
                    };
                    window.SpiceMsgcMouseMotion.prototype = origMouseMotion.prototype;
                }
            })();
        </script>

        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #333333;
                overflow: hidden;
            }
            
            #spice-toolbar {
                background-color: #2c3e50;
                color: #ecf0f1;
                padding: 5px 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-family: "Lucida Grande", "Lucida Sans Unicode", "Helvetica Neue", Helvetica, Arial, Verdana, sans-serif;
                font-size: 12pt;
                border-bottom: 1px solid #34495e;
            }
            
            #spice-status {
                display: flex;
                align-items: center;
                gap: 15px;
            }
            
            #spice-status-text {
                font-weight: normal;
            }
            
            #spice-focus-indicator {
                padding: 2px 8px;
                border-radius: 3px;
                font-size: 10pt;
            }
            
            #spice-focus-indicator.focused {

            }
            
            #spice-focus-indicator.unfocused {

            }
            
            #spice-buttons {
                display: flex;
                gap: 5px;

            #spice-buttons input[type=button] {
                padding: 5px 10px;
                background-color: #3498db;
                color: white;
                border: none;
                border-radius: 3px;
                cursor: pointer;
                font-size: 11pt;
            }
            
            #spice-buttons input[type=button]:hover:not(:disabled) {
                background-color: #2980b9;
            }
            
            #spice-buttons input[type=button]:disabled {
                background-color: #7f8c8d;
                cursor: not-allowed;
            }
            
            #spice-area {
                width: 100vw;
                height: calc(100vh - 35px);
                overflow: hidden;
                background-color: #333333;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            
            /* Overlay captures mouse for whole page; events forwarded to canvas */
            #spice-input-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                pointer-events: auto;
                cursor: default;
            }

        <script>
            var host = null, port = null;
            var sc;
            var isConnected = false;
            var isFocused = false;

            function spice_set_cookie(name, value, days) {
                var date, expires;
                date = new Date();
                date.setTime(date.getTime() + (days*24*60*60*1000));
                expires = "; expires=" + date.toGMTString();
                document.cookie = name + "=" + value + expires + "; path=/";
            };

            function spice_query_var(name, defvalue) {
                var match = RegExp('[?&]' + name + '=([^&]*)')
                                  .exec(window.location.search);
                return match ?
                    decodeURIComponent(match[1].replace(/\+/g, ' '))
                    : defvalue;
            }

            function updateStatus(text, level) {
                var statusText = document.getElementById('spice-status-text');
                if (statusText) {
                    statusText.textContent = text;
                }
            }

            function updateFocusIndicator(focused) {
                isFocused = focused;
                var indicator = document.getElementById('spice-focus-indicator');
                if (indicator) {
                    if (focused) {
                        indicator.textContent = 'Focused';
                        indicator.className = 'focused';
                    } else {
                        indicator.textContent = 'Click to focus';
                        indicator.className = 'unfocused';
                    }
                }
            }

            function sendCtrlAltDel() {
                if (!sc || !sc.inputs || sc.inputs.state !== "ready") {
                    return false;
                }

                // Send Ctrl+Alt+Del key combination
                // Use keycode conversion functions for proper scancode format
                // Ctrl = KEY_LCtrl = 29 (keyCode 17)
                // Alt = KEY_Alt = 56 (keyCode 18)
                // Delete = keyCode 46 -> scancode 0xE053
                
                var msg;
                
                // Press Ctrl (keyCode 17)
                msg = new SpiceMiniData();
                var ctrlDown = new SpiceMsgcKeyDown();
                // keyCode 17 maps to KEY_LCtrl = 29
                ctrlDown.code = keycode_to_start_scan(17);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_DOWN, ctrlDown);
                sc.inputs.send_msg(msg);
                
                // Press Alt (keyCode 18)
                msg = new SpiceMiniData();
                var altDown = new SpiceMsgcKeyDown();
                // keyCode 18 maps to KEY_Alt = 56
                altDown.code = keycode_to_start_scan(18);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_DOWN, altDown);
                sc.inputs.send_msg(msg);
                
                // Press Delete (keyCode 46)
                msg = new SpiceMiniData();
                var delDown = new SpiceMsgcKeyDown();
                // keyCode 46 maps to extended scancode 0xE053
                delDown.code = keycode_to_start_scan(46);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_DOWN, delDown);
                sc.inputs.send_msg(msg);
                
                // Release Delete
                msg = new SpiceMiniData();
                var delUp = new SpiceMsgcKeyUp();
                delUp.code = keycode_to_end_scan(46);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_UP, delUp);
                sc.inputs.send_msg(msg);
                
                // Release Alt
                msg = new SpiceMiniData();
                var altUp = new SpiceMsgcKeyUp();
                altUp.code = keycode_to_end_scan(18);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_UP, altUp);
                sc.inputs.send_msg(msg);
                
                // Release Ctrl
                msg = new SpiceMiniData();
                var ctrlUp = new SpiceMsgcKeyUp();
                ctrlUp.code = keycode_to_end_scan(17);
                msg.build_msg(SPICE_MSGC_INPUTS_KEY_UP, ctrlUp);
                sc.inputs.send_msg(msg);
                
                return false;
            }

            function spice_error(e)
            {
                isConnected = false;
                updateStatus("Connection error", "error");
                document.getElementById('sendCtrlAltDelButton').disabled = true;
                disconnect();
            }

            function connect()
            {
                var host, port, password, scheme = "ws://", uri;

                // By default, use the host and port of server that served this file
                host = spice_query_var('host', window.location.hostname);

                // Note that using the web server port only makes sense
                //  if your web server has a reverse proxy to relay the WebSocket
                //  traffic to the correct destination port.
                var default_port = window.location.port;
                if (!default_port) {
                    if (window.location.protocol == 'http:') {
                        default_port = 80;
                    }
                    else if (window.location.protocol == 'https:') {
                        default_port = 443;
                    }
                }
                port = spice_query_var('port', default_port);
                if (window.location.protocol == 'https:') {
                    scheme = "wss://";
                }

                // If a token variable is passed in, set the parameter in a cookie.
                // This is used by nova-spiceproxy.
                token = spice_query_var('token', null);
                if (token) {
                    spice_set_cookie('token', token, 1)
                }

                password = spice_query_var('password', '');
                path = spice_query_var('path', 'websockify');

                if ((!host) || (!port)) {
                    console.log("must specify host and port in URL");
                    updateStatus("Error: must specify host and port in URL", "error");
                    return;
                }

                if (sc) {
                    sc.stop();
                }

                uri = scheme + host + ":" + port;
                updateStatus("Connecting...", "normal");

                try
                {
                    sc = new SpiceMainConn({uri: uri, screen_id: "spice-screen", dump_id: "debug-div",
                                message_id: "message-div", password: password, onerror: spice_error, onagent: agent_connected });
                    
                    // Monitor connection state by checking display channel
                    var checkConnection = setInterval(function() {
                        if (sc && sc.display) {
                            if (sc.display.state === 'ready' && !isConnected) {
                                isConnected = true;
                                updateStatus("Connected", "normal");
                                document.getElementById('sendCtrlAltDelButton').disabled = false;
                                clearInterval(checkConnection);
                                
                                setupFocusMonitoring();
                                setupFullPageInput();
                            }
                        }
                        if (sc && sc.state === 'closing') {
                            clearInterval(checkConnection);
                        }
                    }, 100);
                    
                    // Focus = iframe/document focus (for "click to type" when embedded)
                    function setupFocusMonitoring() {
                        function refreshFocus() {
                            updateFocusIndicator(document.hasFocus());
                        }
                        window.addEventListener('focus', refreshFocus);
                        window.addEventListener('blur', refreshFocus);
                        setInterval(refreshFocus, 500);
                        refreshFocus();
                    }
                    
                    // Capture mouse on whole page and forward to canvas with correct coordinates
                    function setupFullPageInput() {
                        var canvas = document.querySelector('#spice-screen canvas');
                        var overlay = document.getElementById('spice-input-overlay');
                        if (!canvas || !overlay) {
                            setTimeout(setupFullPageInput, 200);
                            return;
                        }
                        canvas.setAttribute('tabindex', '0');
                        
                        function forwardMouse(type, e) {
                            var opts = {
                                bubbles: true, cancelable: true,
                                clientX: e.clientX, clientY: e.clientY,
                                screenX: e.screenX, screenY: e.screenY,
                                button: e.button, buttons: e.buttons,
                                relatedTarget: e.relatedTarget,
                                view: e.view
                            };
                            if (type === 'wheel') {
                                canvas.dispatchEvent(new WheelEvent('mousewheel', {
                                    bubbles: true, cancelable: true,
                                    clientX: e.clientX, clientY: e.clientY,
                                    deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ,
                                    deltaMode: e.deltaMode
                                }));
                            } else {
                                canvas.dispatchEvent(new MouseEvent(type, opts));
                            }
                        }
                        
                        ['mousedown','mouseup','mousemove','contextmenu','click','dblclick'].forEach(function(type) {
                            overlay.addEventListener(type, function(e) {
                                if (type === 'mousedown') canvas.focus();
                                forwardMouse(type, e);
                                if (type === 'contextmenu') e.preventDefault();
                            });
                        });
                        
                        overlay.addEventListener('mousewheel', function(e) {
                            e.preventDefault();
                            forwardMouse('wheel', e);
                        }, { passive: false });
                    }
                }
                catch (e)
                {
                    alert(e.toString());
                    updateStatus("Connection failed: " + e.toString(), "error");
                    disconnect();
                }

            }

            function disconnect()
            {
                console.log(">> disconnect");
                isConnected = false;
                updateStatus("Disconnected", "normal");
                document.getElementById('sendCtrlAltDelButton').disabled = true;
                if (sc) {
                    sc.stop();
                }
                if (window.File && window.FileReader && window.FileList && window.Blob)
                {
                    var spice_xfer_area = document.getElementById('spice-xfer-area');
                    if (spice_xfer_area && document.getElementById('spice-area').contains(spice_xfer_area)) {
                        document.getElementById('spice-area').removeChild(spice_xfer_area);
                    }
                    document.getElementById('spice-area').removeEventListener('dragover', handle_file_dragover, false);
                    document.getElementById('spice-area').removeEventListener('drop', handle_file_drop, false);
                }
                console.log("<< disconnect");
            }

            function agent_connected(sc)
            {
                window.addEventListener('resize', handle_resize);
                window.spice_connection = this;

                resize_helper(this);

                if (window.File && window.FileReader && window.FileList && window.Blob)
                {
                    var spice_xfer_area = document.createElement("div");
                    spice_xfer_area.setAttribute('id', 'spice-xfer-area');
                    document.getElementById('spice-area').addEventListener('dragover', handle_file_dragover, false);
                    document.getElementById('spice-area').addEventListener('drop', handle_file_drop, false);
                }
                else
                {
                    console.log("File API is not supported");
                }
            }

            // Initialize toolbar button
            window.addEventListener('load', function() {
                document.getElementById('sendCtrlAltDelButton').onclick = sendCtrlAltDel;
                document.getElementById('sendCtrlAltDelButton').disabled = true;
                updateFocusIndicator(false);
            });

            connect();
        </script>

    </head>

    <body>
        <div id="spice-toolbar">
            <div id="spice-status">
                <span id="spice-status-text">Connecting...</span>
                <span id="spice-focus-indicator" class="unfocused">Click to focus</span>
            </div>
            <div id="spice-buttons">
                <input type="button" value="Send Ctrl+Alt+Del" id="sendCtrlAltDelButton" disabled>
            </div>
        </div>

        <div id="spice-area">
            <div id="spice-screen" class="spice-screen"></div>
            <div id="spice-input-overlay" tabindex="0" title="Click to focus for keyboard input"></div>
        </div>

        <div id="message-div" class="spice-message"></div>

        <div id="debug-div">
        <!-- If DUMPXXX is turned on, dumped images will go here -->
        </div>

    </body>
